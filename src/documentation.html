<meta name="color-scheme" content="light dark">
<title>Buoy Documentation</title>
<!--
  Shared Buoy documentation reader: Buoy Studio's native Documentation window and the
  static documentation website use this exact file.

  Public API (stable):
    window.loadDocumentation(snapshot, options?)  -> {ok, pages, error?}
        snapshot: unified documentation JSON (tools/documentation/FORMAT.md).
        options.preserve (default true once a library is shown) keeps the open page,
        query and filters; options.origin is a short label ("bundled", "project", "site").
    window.documentationStatus({state, message, detail, canRefresh})
        state: "idle" | "indexing" | "ready" | "error" | "unavailable". Native only.
  Native bridge (Studio only; absent on the website):
    page -> native: window.buoy.postMessage(JSON) with type ready|copy|bookmarks|reindex|loaded|error|selftest|topic
    native -> page: window.documentationNative.chunk/commit/receive (string literals only).
  Package and upstream HTML is data: it is re-parsed inertly, filtered to an allowlist of
  tags/attributes, and never executed. No remote resources, scripts or navigations.
-->

.content :is(h1,h2,h3,h4,h5,h6){scroll-margin-top:24px;position:relative}

p{margin:16px 0}
ul,ol{padding-left:24px}

.boolean-cell{text-align:center;white-space:nowrap;width:1%}
.t-color{white-space:nowrap}.color-r{color:#d64b52}.color-g{color:#298348}.color-b{color:#397de2}.color-a{color:var(--muted)}

const recent=new Map();
function once(name){const now=Date.now(), last=recent.get(name)||0;recent.set(name,now);return now-last>350;}
function command(name){
  if(['back','forward','bookmark','search'].includes(name)&&!once(name))return;
  switch(name){
    case 'back':goBack();break;
    case 'forward':goForward();break;
    case 'search':focusSearch();break;
    case 'keywords':openKeywordIndex();break;
    case 'find-page':openPageFind();break;
    case 'find-next':findStep(1);break;
    case 'find-previous':findStep(-1);break;
    case 'text-bigger':setReadingScale(readingScale+.1);break;
    case 'text-smaller':setReadingScale(readingScale-.1);break;
    case 'text-actual':setReadingScale(1);break;
    case 'home':if(lib)navigate(lib.byPath.has(lib.snapshot.startPath)?lib.snapshot.startPath:lib.pages[0].path);break;
    case 'bookmark':toggleBookmark();break;
    case 'copy':{const t=selectedText();if(t)copyText(t).then(ok=>{if(!ok)toast('The clipboard is unavailable');});break;}
    case 'select-all':{const a=document.activeElement;if(a&&a.tagName==='INPUT')a.select();else{const r=document.createRange();r.selectNodeContents($('article'));const s=window.getSelection();s.removeAllRanges();s.addRange(r);}break;}
    case 'shortcuts':showKeys();break;
  }
}
window.documentationCommand=command;

/* ---------------- Interaction ---------------- */
function focusSearch(){openNav();const s=$('search');s.focus();s.select();}
let navigationHidden=false,outlinePreference=null;
const paneDefaults={navigation:304,outline:208};
const paneWidths={navigation:304,outline:208};
for(const name of Object.keys(paneWidths))try{const saved=Number(localStorage.getItem('buoy-docs-'+name+'-width'));if(Number.isFinite(saved)&&saved>0)paneWidths[name]=saved;}catch(e){}
try{navigationHidden=localStorage.getItem('buoy-docs-navigation-hidden')==='true';const saved=localStorage.getItem('buoy-docs-outline-hidden');if(saved!==null)outlinePreference=saved!=='true';}catch(e){}
function narrowNavigation(){return window.matchMedia('(max-width:720px)').matches;}
function narrowOutline(){return window.matchMedia('(max-width:1180px)').matches;}
function navigationVisible(){return narrowNavigation()?document.body.classList.contains('nav-open'):!navigationHidden;}
function outlineVisible(){return outlinePreference===null?!narrowOutline():outlinePreference;}
function viewportWidth(){return window.innerWidth||document.documentElement.clientWidth||1600;}
function paneBounds(name){
  const nav=navigationVisible()&&!narrowNavigation()?Number($('navigation-splitter').getAttribute('aria-valuenow'))||paneWidths.navigation:0;
  const outline=outlineVisible()&&!narrowOutline()?Number($('outline-splitter').getAttribute('aria-valuenow'))||paneWidths.outline:0;
  const min=name==='navigation'?220:160;
  const available=name==='navigation'?viewportWidth()-480-(outline?outline+144:0):viewportWidth()-nav-624;
  return {min,max:Math.max(min,Math.min(name==='navigation'?560:420,Math.floor(available)))};
}
function applyPaneWidths(){
  for(const name of ['navigation','outline']){
    const bounds=paneBounds(name),width=Math.max(bounds.min,Math.min(bounds.max,paneWidths[name]));
    document.documentElement.style.setProperty(name==='navigation'?'--sidebar':'--outline',width+'px');
    const splitter=$(name==='navigation'?'navigation-splitter':'outline-splitter');
    splitter.setAttribute('aria-valuemin',String(bounds.min));splitter.setAttribute('aria-valuemax',String(bounds.max));splitter.setAttribute('aria-valuenow',String(width));splitter.setAttribute('aria-valuetext',width+' pixels');
  }
}
function resizePane(name,width){const bounds=paneBounds(name);paneWidths[name]=Math.max(bounds.min,Math.min(bounds.max,Math.round(width)));try{localStorage.setItem('buoy-docs-'+name+'-width',String(paneWidths[name]));}catch(e){}applyPaneWidths();}
function syncPanes(){
  const nav=navigationVisible(),outline=outlineVisible();
  document.body.classList.toggle('nav-hidden',navigationHidden);
  document.body.classList.toggle('outline-hidden',!outline);
  document.body.classList.toggle('outline-open',outline&&narrowOutline());
  $('sidebar').inert=!nav;$('sidebar').setAttribute('aria-hidden',String(!nav));
  $('outline').inert=!outline;$('outline').setAttribute('aria-hidden',String(!outline));
  $('navigation-splitter').hidden=!nav||narrowNavigation();
  $('outline-splitter').hidden=!outline||narrowOutline();
  applyPaneWidths();
  if(paneDrag&&paneDrag.splitter.hidden)finishPaneDrag();
  for(const [id,shown,label] of [['menu',nav,'navigation'],['outline-toggle',outline,'page outline']]){const button=$(id);button.setAttribute('aria-expanded',String(shown));button.setAttribute('aria-label',(shown?'Hide ':'Show ')+label);button.title=(shown?'Hide ':'Show ')+label;}
}
function setNavigationVisible(shown){
  if(narrowNavigation())document.body.classList.toggle('nav-open',shown);
  else{navigationHidden=!shown;try{localStorage.setItem('buoy-docs-navigation-hidden',String(!shown));}catch(e){}}
  syncPanes();
}
function openNav(){setNavigationVisible(true);}
function closeNav(){if(narrowNavigation())setNavigationVisible(false);}
function setOutlineVisible(shown){outlinePreference=shown;try{localStorage.setItem('buoy-docs-outline-hidden',String(!shown));}catch(e){}syncPanes();}
for(const query of ['(max-width:720px)','(max-width:1180px)']){const media=window.matchMedia(query);if(media.addEventListener)media.addEventListener('change',syncPanes);}
window.addEventListener('resize',syncPanes);
let paneDrag=null;
function finishPaneDrag(){
  if(!paneDrag)return;const drag=paneDrag;paneDrag=null;
  document.body.classList.remove('resizing-panes');
  try{if(drag.splitter.hasPointerCapture&&drag.splitter.hasPointerCapture(drag.pointerId))drag.splitter.releasePointerCapture(drag.pointerId);}catch(e){}
}
for(const name of ['navigation','outline']){
  const splitter=$(name==='navigation'?'navigation-splitter':'outline-splitter');
  splitter.addEventListener('pointerdown',e=>{
    if(splitter.hidden||e.button!==0)return;
    e.preventDefault();finishPaneDrag();splitter.focus();
    paneDrag={name,splitter,pointerId:e.pointerId,start:e.clientX,width:Number(splitter.getAttribute('aria-valuenow'))};
    document.body.classList.add('resizing-panes');
    try{if(splitter.setPointerCapture)splitter.setPointerCapture(e.pointerId);}catch(err){}
  });
  splitter.addEventListener('lostpointercapture',finishPaneDrag);
  splitter.addEventListener('dblclick',()=>resizePane(name,paneDefaults[name]));
  splitter.addEventListener('keydown',e=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
    e.preventDefault();e.stopPropagation();const bounds=paneBounds(name),direction=name==='navigation'?1:-1;
    resizePane(name,e.key==='Home'?bounds.min:e.key==='End'?bounds.max:Number(splitter.getAttribute('aria-valuenow'))+(e.key==='ArrowRight'?1:-1)*direction*(e.shiftKey?40:10));
  });
}
document.addEventListener('pointermove',e=>{if(paneDrag&&e.pointerId===paneDrag.pointerId){e.preventDefault();resizePane(paneDrag.name,paneDrag.width+(e.clientX-paneDrag.start)*(paneDrag.name==='navigation'?1:-1));}});
for(const type of ['pointerup','pointercancel'])document.addEventListener(type,e=>{if(paneDrag&&e.pointerId===paneDrag.pointerId)finishPaneDrag();});
window.addEventListener('blur',finishPaneDrag);
syncPanes();
$('searchkey').textContent=MAC?'⌘⇧F':'Ctrl ⇧F';$('search').title='Search all documentation ('+(MAC?'Cmd+Shift+F; Cmd+K':'Ctrl+Shift+F; Ctrl+K')+')';
$('back').title='Back ('+(MAC?'⌘[':'Alt+←')+')';$('forward').title='Forward ('+(MAC?'⌘]':'Alt+→')+')';$('bookmark').title='Save this page ('+MOD+'D)';
$('search').addEventListener('input',()=>{$('results').scrollTop=0;renderResults();});
$('search').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();setActive(active+1);}
  else if(e.key==='ArrowUp'){e.preventDefault();setActive(active-1);}
  else if(e.key==='Enter'){const items=$('results').querySelectorAll('.result');const pick=items[active>=0?active:0];if(pick){e.preventDefault();pick.click();if(active<0)$('article').focus({preventScroll:true});}}
});
$('results').addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  const items=[...$('results').querySelectorAll('.result, details.group>summary')].filter(x=>x.offsetParent!==null);
  const i=items.indexOf(document.activeElement);if(i<0)return;e.preventDefault();
  const next=items[e.key==='ArrowDown'?Math.min(items.length-1,i+1):Math.max(0,i-1)];if(next)next.focus();
  if(e.key==='ArrowUp'&&i===0)$('search').focus();

$('scope').addEventListener('change',()=>{$('results').scrollTop=0;if($('scope').value)openGroups.add($('scope').value);renderResults();});
$('all').onclick=()=>{setSaved(false);renderResults();};
$('saved').onclick=()=>{setSaved(true);renderResults();};
$('back').onclick=goBack;$('forward').onclick=goForward;$('bookmark').onclick=toggleBookmark;
$('help').onclick=showKeys;
$('menu').onclick=()=>setNavigationVisible(!navigationVisible());
$('outline-toggle').onclick=()=>setOutlineVisible(!outlineVisible());
$('outline').addEventListener('click',e=>{if(narrowOutline()&&e.target.closest('a'))setOutlineVisible(false);});
$('refresh').onclick=()=>{if(bridge({type:'reindex'})){lastStatus=Object.assign({},lastStatus,{state:'indexing',message:'Refreshing project package documentation…'});renderStatus();}};
// WebKit's stock Open Link follows about:blank#/… instead of our router.
// Keep native context-menu navigation inside the loaded documentation library.
document.addEventListener('contextmenu',e=>{
  if(!NATIVE||!current)return;
  const a=e.target.closest&&e.target.closest('a');if(!a)return;
  const href=a.getAttribute('href')||'';
  let target=a.dataset.docTarget||(a.dataset.target?current.path+'#'+a.dataset.target:'');
  if(!target&&href.startsWith('#/')){try{target=decodeURI(href.slice(1));}catch(err){return;}}
  if(!target&&href.startsWith('#'))target=current.path+href;
  if(!target&&href.startsWith('/'))target=href;
  if(!target)return;
  e.preventDefault();
  const actions=el('div','link-actions'),open=el('button',null,'Open Link'),copy=el('button',null,'Copy Link');
  open.type=copy.type='button';
  open.onclick=()=>{closeDialog();navigate(target);};
  copy.onclick=()=>{closeDialog();copyText(shareLinkFor(target)).then(ok=>toast(ok?'Link copied':'Could not copy link'));};
  actions.append(open,copy);openDialog('Documentation link',[],actions);open.focus();
});
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a');if(!a||a.classList.contains('skip'))return;
  if(!NATIVE&&(e.metaKey||e.ctrlKey||e.shiftKey)&&!(a.closest('pre')&&a.classList.contains('type-link')))return;
  e.preventDefault();
  const href=a.getAttribute('href')||'';
  if(a.dataset.docTarget){if(a.closest('pre')&&e.detail!==0&&!e.metaKey&&!e.ctrlKey)return;navigate(a.dataset.docTarget);return;}
  if(a.dataset.target){if(current)navigate(current.path+'#'+a.dataset.target);return;}
  if(href.startsWith('#')){if(current)navigate(current.path+href);return;}
  if(/^https?:/i.test(href)){copyText(href).then(ok=>toast(ok?'External link copied — it opens outside the offline documentation':'External links open outside the offline documentation: '+href));return;}
  if(href.startsWith('/'))navigate(href);
});
document.addEventListener('keydown',e=>{
  const mod=(MAC?e.metaKey:e.ctrlKey), key=(e.key||'').toLowerCase(), typing=e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA');
  if($('overlay').classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();closeDialog();}
    if(e.key==='Tab'){const items=[...$('overlay').querySelectorAll('button,a[href],input,select,[tabindex="0"]')].filter(n=>!n.disabled&&!n.hidden);if(items.length){const index=items.indexOf(document.activeElement),next=(index+(e.shiftKey?-1:1)+items.length)%items.length;e.preventDefault();items[next].focus();}}
    return;
  }
  if(mod&&key==='f'&&e.shiftKey){e.preventDefault();focusSearch();return;}
  if(mod&&key==='f'){e.preventDefault();openPageFind();return;}
  if(mod&&key==='g'||e.key==='F3'){e.preventDefault();findStep(e.shiftKey?-1:1);return;}
  if(mod&&['+','=','-','0'].includes(key)){e.preventDefault();if(key==='0')setReadingScale(1);else setReadingScale(readingScale+(key==='-'?-.1:.1));return;}
  if(mod&&key==='k'){e.preventDefault();command('search');return;}
  if(mod&&key==='d'){e.preventDefault();command('bookmark');return;}
  if(!typing&&((mod&&e.key==='[')||(MAC&&e.metaKey&&e.key==='ArrowLeft')||(!MAC&&!typing&&e.altKey&&e.key==='ArrowLeft'))){e.preventDefault();command('back');return;}
  if(!typing&&((mod&&e.key===']')||(MAC&&e.metaKey&&e.key==='ArrowRight')||(!MAC&&!typing&&e.altKey&&e.key==='ArrowRight'))){e.preventDefault();command('forward');return;}
  if(!typing&&MAC&&e.metaKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();scrollArticle(e.key==='ArrowUp'?'Home':'End',false);return;}
  if(!typing&&!MAC&&e.ctrlKey&&(e.key==='Home'||e.key==='End')){e.preventDefault();scrollArticle(e.key,false);return;}
  const interactive=e.target&&e.target.closest&&e.target.closest('input,textarea,select,button,a,summary,[contenteditable="true"]');
  if(!typing&&!interactive&&!mod&&!e.altKey&&scrollArticle(e.key,e.shiftKey)){e.preventDefault();return;}
  if(e.key==='Escape'){
    if(narrowOutline()&&outlineVisible()){setOutlineVisible(false);$('outline-toggle').focus();return;}
    if(document.body.classList.contains('nav-open')){closeNav();return;}
    if(e.target===$('search')){if($('search').value){$('search').value='';renderResults();}else $('article').focus({preventScroll:true});e.preventDefault();}
    return;
  }
  if(!typing&&!mod&&!e.altKey){if(e.key==='/'){e.preventDefault();focusSearch();}else if(e.key==='?'){e.preventDefault();showKeys();}}
});

/* ---------------- Self-test (native smoke test and DOM tests) ---------------- */
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function runSelfTest(options){
  const checks=[];const need=(ok,what)=>{if(!ok)throw Error(what);checks.push(what);};
  try{
    need(lib&&lib.pages.length>0,'library loaded');
    need(current&&document.querySelector('#article h1'),'initial article rendered');
    const html=search('HTMLView');need(html.pages.length>0,'full-text search');
    $('scope').value='section:reference';const ref=search('window');need(ref.pages.length>0&&ref.pages.every(p=>p.section==='reference'&&!isPackage(p)),'source filter');$('scope').value='';
    const start=current.path;
    const withCode=lib.pages.find(p=>p.path!==start&&!isPackage(p)&&/<pre/.test(p.html)&&/language-buoy/.test(p.html));
    need(withCode&&navigate(withCode.path),'navigate to a code page');
    need(document.querySelector('#article .codeblock .copy'),'per-block copy control');
    need(document.querySelector('#article .codeblock .t-kw'),'Buoy syntax highlighting');
    need($('crumbs').querySelectorAll('li').length>=2,'breadcrumbs');
    goBack();if(!NATIVE)await wait(60);need(current.path===resolve(start).p.path,'history back');
    goForward();if(!NATIVE)await wait(60);need(current===withCode,'history forward');
    toggleBookmark();need(bookmarks.has(current.path),'bookmark');toggleBookmark();
    {const t=openTopic('String.Trim','symbol');need(t.ok&&t.how==='definition'&&current.relative==='documentation/strings.md'&&currentHash==='definition-stringtrim','topic: symbol definition');}
    {const t=openTopic('Dim','keyword');need(t.ok&&t.how==='keyword'&&current.relative==='documentation/variables-and-constants.md','topic: keyword page');}
    {const t=openTopic('zzqxnotaword','');need(!t.ok&&$('search').value==='zzqxnotaword','topic: search fallback');$('search').value='';renderResults();}
    need(await copyText('Buoy documentation self-test'),'clipboard copy confirmed');
    const frag=sanitize('<p onclick="x()">a</p><scr'+'ipt>bad()<\/scr'+'ipt><img src="https://example.com/x.png" alt="r"><a href="javascript:alert(1)">j</a><iframe src="https://example.com"></iframe><style>body{}</style>');
    const box=document.createElement('div');box.append(frag);
    need(!box.querySelector('script,iframe,style,[onclick],img')&&!box.querySelector('a[href]')&&box.querySelector('.img-missing'),'sanitizer');
    need(!document.querySelector('[src^="http"],script[src],link[href],iframe'),'no remote resources');
    if(options.package){
      const id='package:'+options.package;const page=lib.pages.find(p=>sourceIdOf(p)===id);
      need(page,'package pages present');need([...$('scope').options].some(o=>o.value===id),'package source filter');
      need(navigate(page.path),'open package page');
      need(document.querySelector('#article .badge.pkg')&&(!page.version||document.querySelector('#article .badge.ver').textContent==='v'+page.version),'package/version badges');
      if(options.query){const q=search(options.query);need(q.pages.some(p=>sourceIdOf(p)===id),'package search');}
    }
    if(options.expectNoPackages)need(![...lib.sources.keys()].some(k=>k!=='upstream'),'previous library kept upstream only');
    bridge({type:'selftest',ok:true,pages:lib.pages.length,sources:lib.sources.size,checks});
    return {ok:true,checks};
  }catch(e){bridge({type:'selftest',ok:false,error:e.message,checks});return {ok:false,error:e.message,checks};}
}
window.runDocumentationSelfTest=runSelfTest;

if(NATIVE){
  window.addEventListener('error',e=>bridge({type:'error',message:String(e.message||'script error')}));

}else{

}
